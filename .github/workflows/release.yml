name: Release

on:
  push:
    branches: [main, 'next', '[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: sightpress/.github/.github/workflows/release.yml@main
    with:
      package: sightpress/plugin-core
      dependents: '["core","plugin-template","plugin-articles","plugin-community","plugin-forms","plugin-newsletter","plugin-notifications","plugin-image-finder","plugin-ai","plugin-import"]'
      event-type: plugin-core-released
    secrets: inherit
